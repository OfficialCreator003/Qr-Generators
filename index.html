<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QR Code Generator</title>

<style>
body{
    font-family:Arial;
    background:#f4f6f8;
    text-align:center;
    padding:40px;
}

h1{margin-bottom:20px}

input, button{
    padding:10px;
    margin:8px;
    border-radius:6px;
    border:1px solid #ccc;
}

button{
    background:#007bff;
    color:white;
    border:none;
    cursor:pointer;
}

button:hover{background:#0056b3}

#qr-container{margin-top:20px}
</style>
</head>

<body>

<h1>QR Code Generator</h1>

<input type="text" id="url" placeholder="Enter URL (e.g. google.com)"><br>

Foreground: <input type="color" id="color-dark" value="#000000">
Background: <input type="color" id="color-light" value="#ffffff"><br>

<input type="file" id="logo" accept="image/*"><br>

<button onclick="generateQR()">Generate QR</button>
<button id="downloadBtn" onclick="downloadQR()" style="display:none;">Download</button>

<div id="qr-container"></div>

<!-- Stable CDN -->
<script src="https://unpkg.com/qr-code-styling@1.6.0/lib/qr-code-styling.js"></script>

<script>
let qrCode = null;

function generateQR(){

    if(typeof QRCodeStyling === "undefined"){
        alert("QR library failed to load");
        return;
    }

    let url = document.getElementById("url").value.trim();
    const colorDark = document.getElementById("color-dark").value;
    const colorLight = document.getElementById("color-light").value;
    const logoInput = document.getElementById("logo");
    const container = document.getElementById("qr-container");
    const downloadBtn = document.getElementById("downloadBtn");

    container.innerHTML = "";
    downloadBtn.style.display = "none";

    if(!url){
        alert("Enter a URL");
        return;
    }

    // auto fix URL
    if(!/^https?:\/\//i.test(url)){
        url = "https://" + url;
    }

    qrCode = new QRCodeStyling({
        width:300,
        height:300,
        data:url,
        type:"canvas",
        dotsOptions:{
            color:colorDark,
            type:"rounded"
        },
        backgroundOptions:{
            color:colorLight
        },
        imageOptions:{
            crossOrigin:"anonymous",
            margin:10
        }
    });

    if(logoInput.files.length > 0){
        const reader = new FileReader();

        reader.onload = function(e){
            qrCode.update({image:e.target.result});

            setTimeout(()=>{
                qrCode.append(container);
                downloadBtn.style.display = "inline-block";
            },100);
        };

        reader.onerror = function(){
            alert("Error loading image");
        };

        reader.readAsDataURL(logoInput.files[0]);
    }
    else{
        qrCode.append(container);
        downloadBtn.style.display = "inline-block";
    }
}

function downloadQR(){
    if(qrCode){
        qrCode.download({
            name:"qr-code",
            extension:"png"
        });
    }
}
</script>

</body>
</html>
